# Include inside the HTTPS server block for the configured STUDIO_PUBLIC_URL.
# The gateway listens on the same server as Nginx.
location = /interior-design {
    return 308 /interior-design/$is_args$args;
}

location ^~ /interior-design/ {
    client_max_body_size 42m;
    proxy_pass http://127.0.0.1:4174;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 90s;
}
