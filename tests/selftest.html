<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio 自测 · selftest</title>
<style>
  :root{--bg:#f3efe7;--panel:#fffdf9;--line:#e3dccf;--ink:#2b2824;--muted:#8a8174;--ok:#2f7a4f;--bad:#b3372a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:15px}
  header span{color:var(--muted)}
  #result{margin:0;padding:12px 16px;white-space:pre-wrap;word-break:break-all;
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  #result.done-pass{color:var(--ok)}
  #result.done-fail{color:var(--bad)}
  iframe{display:block;width:1120px;max-width:100%;height:620px;margin:0 16px 16px;
    border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>
<header><b>Studio 自测</b><span>在 iframe 中加载 ../index.html，等待 window.Studio 后逐条断言</span></header>
<pre id="result"></pre>
<iframe id="app" src="../index.html" title="studio under test"></iframe>

<script>
/* ============================================================
 * 零依赖自测页：把 iframe 里的 window.Studio 当成被测对象。
 * 结果以 JSON 写进 <pre id="result">，供 tests/run.mjs 用 --dump-dom 抓取。
 * ============================================================ */
const RESULT = document.getElementById('result');
const frame = document.getElementById('app');
const CHECKS = [];
const ctx = {};                       // 跨断言共享被测对象
let finished = false;

function flush(){
  const passed = CHECKS.filter(c => c.ok).length;
  RESULT.textContent = JSON.stringify({
    passed, failed: CHECKS.length - passed, done: finished, checks: CHECKS,
  });
  if (finished){
    RESULT.className = passed === CHECKS.length ? 'done-pass' : 'done-fail';
    RESULT.textContent = JSON.stringify({
      passed, failed: CHECKS.length - passed, done: true, checks: CHECKS,
    }, null, 2);
  }
}

function record(name, ok, detail){
  CHECKS.push({name, ok: !!ok, detail: String(detail == null ? '' : detail)});
  flush();
}

// 单条断言：抛错记为 failed，继续下一条
async function check(name, fn){
  try {
    const detail = await fn();
    record(name, true, detail == null ? 'ok' : detail);
  } catch(e){
    record(name, false, (e && e.message) || String(e));
  }
}

function assert(cond, msg){ if (!cond) throw new Error(msg); }
const typeName = v => Array.isArray(v) ? 'array' : (v === null ? 'null' : typeof v);

// 轮询等待：返回 true 表示条件在超时前成立
function waitFor(fn, timeoutMs, intervalMs){
  return new Promise(resolve => {
    const t0 = Date.now();
    (function tick(){
      let ok = false;
      try { ok = !!fn(); } catch(e){}
      if (ok) return resolve(true);
      if (Date.now() - t0 >= timeoutMs) return resolve(false);
      setTimeout(tick, intervalMs || 50);
    })();
  });
}

const win = () => frame.contentWindow;
const studio = () => {
  const S = win() && win().Studio;
  assert(S && typeof S === 'object', 'window.Studio 不存在');
  return S;
};

const API_METHODS = ['getPlan','getState','applyPlan','applyOps','getSelection','select',
                     'flyToRoom','renderAll','sync','toast','is3D','shot'];

async function main(){
  // Studio 由页面内联脚本同步挂载；等 iframe 文档就绪即可，最长 15 秒
  const ready = await waitFor(() => win() && win().Studio && win().document.readyState !== 'loading', 15000, 25);
  if (ready){
    // 默认方案是异步 fetch 的，等它落地再开始，避免断言读到半初始化状态
    await waitFor(() => {
      const S = win().Studio;
      const p = S && S.getPlan();
      return p && Array.isArray(p.rooms) && p.rooms.length > 0;
    }, 5000, 50);
    await new Promise(r => setTimeout(r, 200));
  }

  await check('studio.api', () => {
    const S = studio();
    const missing = API_METHODS.filter(k => typeof S[k] !== 'function');
    assert(!missing.length, '缺少方法：' + missing.join(', '));
    return '全部 ' + API_METHODS.length + ' 个方法均为函数';
  });

  await check('plan.shape', () => {
    const S = studio();
    const p = S.getPlan();
    assert(p && typeof p === 'object' && !Array.isArray(p), 'getPlan() 未返回对象（' + typeName(p) + '）');
    assert(Array.isArray(p.rooms) && p.rooms.length > 0, 'rooms 不是非空数组（' + typeName(p.rooms) + '）');
    assert(Array.isArray(p.walls), 'walls 不是数组（' + typeName(p.walls) + '）');
    const r0 = p.rooms[0];
    ctx.roomId = r0 && r0.id;
    assert(p.version === 2, 'getPlan() 不是 Plan V2（version=' + p.version + '）');
    assert(p.walls.every(w => w && typeof w.id === 'string' && (Array.isArray(w.rect) || Array.isArray(w.from))), '墙体不是带 id 的 V2 对象');
    const checks = S.getChecks();
    assert(checks.count === 0, '默认空户型不应有待确认问题：' + checks.issues.map(issue => issue.code + ' ' + issue.message).join('；'));
    const status = win().document.querySelector('#checkStatus');
    assert(status && status.hidden, '没有问题时状态带应隐藏');
    return 'rooms=' + p.rooms.length + '，walls=' + p.walls.length + '，首个房间=' + ctx.roomId + '，初始检查 0 处';
  });

  await check('applyOps.setRoom', () => {
    const S = studio();
    const id = ctx.roomId;
    assert(id, '没有可用的房间 id');
    const st0 = S.getState();
    assert(st0 && typeof st0 === 'object' && st0.rooms && typeof st0.rooms === 'object',
      'getState() 未返回带 rooms 的对象');
    assert(st0.rooms[id], 'state.rooms 缺少房间 ' + id);
    ctx.origMat = st0.rooms[id].mat;

    const res = S.applyOps([{op:'setRoom', room:id, mat:'wood'}]);
    assert(res && typeof res === 'object', 'applyOps 未返回对象');
    assert(res.applied >= 1, 'applied=' + res.applied + '，期望 >= 1；errors=' + JSON.stringify(res.errors || []));
    const st1 = S.getState();
    assert(st1.rooms[id], '撤销前的 state.rooms 丢失房间 ' + id);
    assert(st1.rooms[id].mat === 'wood', 'getState().rooms.' + id + '.mat=' + st1.rooms[id].mat + '，期望 wood');
    return 'applied=' + res.applied + '，skipped=' + res.skipped + '，' + id + '.mat: ' + ctx.origMat + ' → wood';
  });

  await check('applyOps.undo', () => {
    const S = studio();
    const id = ctx.roomId;
    assert(id, '没有可用的房间 id');
    if (typeof S.undo === 'function'){
      S.undo();
    } else {
      // 没有便捷入口时退回键盘快捷键（Ctrl+Z）。
      // 必须派发到 body 并冒泡：页面的监听器会读 e.target.matches(...)，target 为 document 时会抛错。
      const w = win();
      const target = w.document.body || w.document.documentElement;
      target.dispatchEvent(new w.KeyboardEvent('keydown',
        {key:'z', code:'KeyZ', keyCode:90, ctrlKey:true, bubbles:true, cancelable:true}));
    }
    const st = S.getState();
    assert(st.rooms[id], '撤销后 state.rooms 丢失房间 ' + id);
    assert(st.rooms[id].mat === ctx.origMat,
      '撤销后 ' + id + '.mat=' + st.rooms[id].mat + '，期望回到 ' + ctx.origMat);
    return 'mat 已回到 ' + ctx.origMat + '（撤销入口：' + (typeof S.undo === 'function' ? 'Studio.undo' : 'Ctrl+Z') + '）';
  });

  await check('applyOps.unknownId', () => {
    const S = studio();
    const before = JSON.stringify(S.getState());
    let res;
    try {
      res = S.applyOps([{op:'setRoom', room:'__no_such_room__', mat:'wood'}]);
    } catch(e){
      throw new Error('未知 id 的 op 抛出异常：' + ((e && e.message) || e));
    }
    assert(res && typeof res === 'object', 'applyOps 未返回对象');
    assert(res.skipped >= 1, 'skipped=' + res.skipped + '，期望 >= 1');
    assert(res.applied === 0, 'applied=' + res.applied + '，期望 0');
    assert(JSON.stringify(S.getState()) === before, '未知 id 的 op 不应改动 state');
    return 'skipped=' + res.skipped + '，applied=' + res.applied + '，未抛错且 state 未变';
  });

  await check('applyPlan.importFurniture', () => {
    const S = studio();
    const previousPlan = S.getPlan();
    const previousFurniture = S.getState().furniture;
    const [x, y] = previousPlan.rooms[0].poly[0];
    const furniture = {type:'chair', name:'图纸餐椅', cx:x+500, cy:y+600, w:470, d:510, rot:32.5};
    const plan = {...previousPlan, name:'导入家具自测'};
    const result = S.applyPlan(plan, {furniture:[furniture], clearFurniture:true, freshState:true});
    assert(result.ok, '导入方案失败');
    try {
      const [imported, ...others] = S.getState().furniture;
      assert(imported && imported.id && others.length === 0, '应生成一个带 ID 的家具实例');
      for (const [key, value] of Object.entries(furniture)){
        assert(imported[key] === value, key + ' 未保留原值 ' + value);
      }
      const stored = JSON.parse(win().localStorage.getItem('interior-state-v1'));
      assert(stored.furniture[0].id === imported.id, '家具未保存到项目状态');
    } finally {
      S.undo();
    }
    assert(S.getPlan().name === previousPlan.name, '一次撤销应还原户型');
    assert(JSON.stringify(S.getState().furniture) === JSON.stringify(previousFurniture), '一次撤销应还原家具');
    return '坐标、尺寸和 32.5° 朝向已保留并保存，户型和家具可一起撤销';
  });

  await check('applyPlan.importComponents', () => {
    const S = studio();
    const plan = S.getPlan();
    const count = S.getState().furniture.length;
    const [x, y] = plan.rooms[0].poly[0];
    const component = {type:'component', name:'折返楼梯', cx:x+1000, cy:y+1200, w:1600, d:2200, rot:90, parts:[
      {shape:'stairs', x:-.25, z:0, w:.5, d:.7, y:0, h:900, steps:5},
      {shape:'winder', x:0, z:.4, w:1, d:.2, y:900, h:720, steps:4, pivot:[0,-.5],
        edges:[[-.5,-.5],[-.5,.5],[0,.5],[.5,.5],[.5,-.5]]},
      {shape:'stairs', x:.25, z:0, w:.5, d:.7, y:1620, h:900, rot:180, steps:5},
    ]};
    assert(S.applyPlan(plan, {furniture:[component]}).ok, '合并构件失败');
    try {
      const imported = S.getState().furniture.find(item => item.name === component.name);
      assert(imported?.parts.length === 3, '梯段和扇形转角被丢弃');
      for (const [i, part] of component.parts.entries()){
        for (const [key, value] of Object.entries(part)){
          assert(JSON.stringify(imported.parts[i][key]) === JSON.stringify(value), '部件 ' + i + ' 的 ' + key + ' 未保留');
        }
      }
      const stored = JSON.parse(win().localStorage.getItem('interior-state-v1'));
      assert(stored.furniture.some(item => item.id === imported.id && item.parts.length === 3), '构件未保存');
      const footprint = win().document.querySelector('#gFurn [data-fid="' + imported.id + '"]');
      assert(footprint && footprint.querySelectorAll('line').length >= 8, '平面图里没有绘出踏步线');
      assert(footprint.querySelectorAll('[data-part-shape="winder"] polygon').length === 4, '平面图里没有绘出四级扇形踏步');
    } finally {
      S.undo();
    }
    assert(S.getState().furniture.length === count, '撤销未还原原布置');
    return '直梯和四级扇形踏步已绘制、保存并支持撤销';
  });

  await check('applyPlan.curves', () => {
    const S = studio(), doc = win().document, original = S.projectJSON();
    const curve = {from:[0,0], to:[2000,0], sweep:90, thickness:180};
    const room = {id:'curved',name:'弧形测试房',poly:[[0,0],[2000,0],[2000,2000],[0,2000]],arcs:[{edge:0,sweep:90}],mat:'wood'};
    const plan = {name:'弧形测试', walls:[[0,2000,2000,2180,'e'],{...curve,kind:'n',height:2300}],
      wins:[{...curve,from:[2000,0],to:[2000,2000]}], rooms:[room]};
    const result = S.applyPlan(plan);
    assert(result.ok && result.errors.length === 0, '弧形方案校验失败');
    try {
      const active = S.getPlan();
      assert(active.walls[1].height === 2300 && active.wins[0].sweep === 90 && active.rooms[0].arcs[0].edge === 0, '圆弧字段未保留');
      assert(active.bounds.y < -414 && active.bounds.x + active.bounds.w > 2414, '方案范围未包含圆弧外缘');
      assert(doc.querySelector('#gWalls rect') && doc.querySelector('#gWalls path[data-wall="' + active.walls[1].id + '"]'), '二维墙体应同时绘制直线和弧线');
      assert(doc.querySelectorAll('#gOpen path').length === 3, '圆弧窗缺少外轮廓或框线');
      assert(/A[\d.]+/.test(doc.querySelector('#gRooms path[data-room="curved"]').getAttribute('d')), '房间边界未绘制圆弧');
      assert(doc.querySelector('#subtitle').textContent.includes('4.57 m²'), '房间面积应包含圆弧弓形');
      assert(JSON.parse(win().localStorage.getItem('interior-plan-v1')).rooms[0].arcs[0].sweep === 90, '圆弧边未写入项目存储');
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复原方案');
    return '弧形墙窗、房间轮廓、面积、存储和撤销';
  });

  await check('importDrawing.fileDrop', () => {
    const w = win(), doc = w.document;
    const drop = doc.querySelector('#impDrop'), title = doc.querySelector('#impDropTitle');
    const start = doc.querySelector('#impStart'), list = doc.querySelector('#impFiles');
    const send = (target, type, dataTransfer, relatedTarget = null) => {
      const event = new w.DragEvent(type, {bubbles:true, cancelable:true, dataTransfer, relatedTarget});
      target.dispatchEvent(event);
      return event.defaultPrevented;
    };
    const files = new w.DataTransfer();
    files.items.add(new w.File(['drawing'], '户型.png', {type:'image/png'}));
    files.items.add(new w.File(['pdf'], '补充图纸.pdf', {type:'application/pdf'}));
    assert(w.impOpen(), '无法打开导入窗口');
    try {
      assert(start.disabled, '导入窗口打开时应等待文件');
      const text = new w.DataTransfer();
      text.setData('text/plain', '备注');
      assert(!send(drop, 'dragover', text) && !drop.classList.contains('drag-over'), '普通文本应由浏览器原样处理');
      assert(send(title, 'dragover', files) && drop.classList.contains('drag-over'), '文件拖入时应高亮投放区');
      send(title, 'dragleave', files, drop);
      assert(drop.classList.contains('drag-over'), '在投放区内部移动时应保持高亮');
      assert(send(doc.body, 'drop', files) && !drop.classList.contains('drag-over'), '拖到外部时应取消高亮并阻止页面跳转');
      assert(start.disabled && !list.children.length, '外部投放不应添加文件');
      assert(send(title, 'drop', files) && !drop.classList.contains('drag-over'), '投放后应清除高亮');
      assert(list.children.length === 2 && list.textContent.includes('户型.png') && list.textContent.includes('补充图纸.pdf'), '应同时列出拖入的文件');
      assert(!start.disabled && doc.querySelector('#impProg').hidden, '拖入仅选中文件，应等待用户点击上传');
      const empty = new w.DataTransfer();
      empty.items.add(new w.File([], '空文件.png'));
      send(drop, 'drop', empty);
      assert(list.children.length === 2 && doc.querySelector('#impErr').classList.contains('on'), '拖入文件应沿用空文件检查');
      list.querySelector('button').click();
      list.querySelector('button').click();
      assert(start.disabled && !list.children.length, '移除文件后应重新等待选择');
      send(drop, 'dragover', files);
    } finally {
      w.impClose();
    }
    assert(!drop.classList.contains('drag-over') && !send(doc.body, 'dragover', files), '关闭后应清除高亮并恢复页面拖放');
    return '拖入多个文件、投放反馈、文件移除与手动提交';
  });

  await check('importReview.attachOriginal', async () => {
    const w = win(), doc = w.document, S = studio();
    const live = JSON.stringify(S.projectJSON());
    const id = 'attach-review-test', oldId = 'import-00000000-0000-4000-8000-000000000001';
    const newId = 'import-00000000-0000-4000-8000-000000000002';
    const snapshot = S.projectJSON();
    const row = {id, jobId:oldId, name:'补传测试', phase:'saved', snapshot, sourceAvailable:false, reviewEnabled:true,
      createdAt:Date.now(), updatedAt:Date.now()};
    const fetch = w.fetch, XHR = w.XMLHttpRequest;
    const rows = w.eval('projectRows');
    let attachment, requested;
    w.fetch = (url, options) => {
      if (!String(url).endsWith('/' + newId + '/review')) return fetch(url, options);
      requested = {method:options.method, body:JSON.parse(options.body)};
      return Promise.resolve(new w.Response('{"ok":true}', {status:202}));
    };
    w.XMLHttpRequest = class {
      upload = {};
      open(method, url){ this.method = method; this.url = url; }
      setRequestHeader(){}
      send(data){
        attachment = {method:this.method, url:this.url, body:JSON.parse(data)};
        this.status = 200;
        this.responseText = JSON.stringify({id:newId, sourceAvailable:true, reviewEnabled:true});
        w.queueMicrotask(() => this.onload());
      }
    };
    try {
      await w.putProject(row);
      assert(w.projectActions(row).includes('补传原图'), '缺少原图的项目应提供补传入口');
      w.projectOpenSource(row);
      assert(doc.querySelector('#impTitle').textContent === '补传原图', '应打开补传原图窗口');
      const dataTransfer = new w.DataTransfer();
      dataTransfer.items.add(new w.File(['test drawing'], '原图.png', {type:'image/png'}));
      doc.querySelector('#impDrop').dispatchEvent(new w.DragEvent('drop', {bubbles:true, cancelable:true, dataTransfer}));
      doc.querySelector('#impStart').click();
      assert(await waitFor(() => requested && rows.get(id)?.review?.state === 'pending', 3000), '保存后应开始后台复核');
      assert(attachment.method === 'POST' && attachment.url.endsWith('/' + oldId + '/source'), '应补传至原有任务关联');
      assert(attachment.body.files[0].name === '原图.png' && attachment.body.result.plan.name === snapshot.plan.name, '补传应同时提供原图和恢复所需的快照');
      const linked = rows.get(id);
      assert(linked.jobId === newId && linked.oldJobs.includes(oldId) && linked.sourceAvailable, '应将原项目关联到恢复后的任务');
      assert(requested.method === 'POST' && requested.body.result.plan.name === snapshot.plan.name, '应复核现有方案');
      assert(JSON.stringify(linked.snapshot) === JSON.stringify(snapshot) && JSON.stringify(S.projectJSON()) === live, '补传和复核不应改动方案');
    } finally {
      w.fetch = fetch;
      w.XMLHttpRequest = XHR;
      w.eval('clearTimeout(projectTimer)');
      rows.delete(id);
      w.impClose();
    }
    return '拖入原图，恢复过期关联，复核现有方案并保留编辑';
  });

  await check('importReview.furnitureGeometry', () => {
    const S = studio(), w = win(), doc = w.document, original = S.projectJSON();
    const plan = {...original.plan, rooms:[{id:'living',name:'客餐厅',mat:'wood',poly:[[0,0],[6000,0],[6000,5000],[0,5000]]}]};
    const furniture = [
      {type:'cornersofa',name:'右转角沙发',cx:3600,cy:1700,w:3300,d:2800,rot:0,handedness:'right'},
      {type:'coffeetable',name:'小圆茶几',cx:3200,cy:1800,w:800,d:800,rot:0,topShape:'round',height:310},
      {type:'sidetable',name:'矩形条几',cx:5500,cy:1600,w:1750,d:400,rot:90,topShape:'rect'},
    ];
    assert(w.impOpenResult({plan, furniture}, () => null), '无法打开图纸结果预览');
    try {
      const preview = doc.querySelector('#impRoomDrawing');
      assert(preview.querySelector('g[transform="scale(-1 1)"]') && preview.querySelector('ellipse[rx="400"]') && preview.querySelector('rect[width="1750"]'), '预览与家具几何不一致');
    } finally { w.impClose(); }

    assert(S.applyPlan(plan, {furniture, clearFurniture:true, freshState:true}).ok, '无法应用家具几何');
    try {
      const [sofa, table, side] = S.projectJSON().state.furniture;
      assert(sofa.handedness === 'right' && table.topShape === 'round' && table.height === 310 && side.topShape === 'rect', '保存或导出时遗失家具几何');
      const shape = id => doc.querySelector('#gFurn [data-fid="' + id + '"]');
      assert(shape(sofa.id).querySelector('g[transform="scale(-1 1)"]'), '转角未在沙发右侧');
      assert(shape(table.id).querySelector('ellipse[rx="400"][ry="400"]') && shape(side.id).querySelector('rect'), '台面形状丢失');
      S.select({kind:'furn', id:sofa.id});
      const select = doc.querySelector('#fHandedness');
      assert(select.value === 'right', '右侧属性未加载');
      select.value = 'left'; select.dispatchEvent(new w.Event('change'));
      assert(!shape(sofa.id).querySelector('g[transform="scale(-1 1)"]'), '属性修改未影响沙发轮廓');
      S.undo();
      assert(S.getState().furniture[0].handedness === 'right', '属性修改无法撤销');
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复原项目');
    return '逐房预览、转角侧、台面形状和高度可保存与撤销';
  });

  await check('applyOps.editScene', () => {
    const S = studio();
    const before = S.projectJSON();
    const room = before.plan.rooms[0].id;
    const [x, y] = before.plan.rooms[0].poly[0];
    const wall = [x+400,y+600,x+1400,y+720,'n',2450];

    doc.querySelector('#winSolid').click();
    assert(S.getPlan().wins.length === 0, '窗转实墙失败');
    S.select({kind:'door', id:'d1'});
    assert(doc.querySelector('#doorName') && doc.querySelector('#doorEntry'), '门面板字段缺失');
    const bay = S.addBayWindow('r1', 1, 600);   // 右侧竖边
    assert(bay.ok && S.getPlan().rooms.length === 2, '新增飘窗模块失败');
    const bayRoom = S.getPlan().rooms.find(item => item.counted === false);
    assert(bayRoom && bayRoom.bay && bayRoom.bay.sill === 450, '飘窗房间缺窗台高');
    assert(S.getPlan().wins.length >= 3, '飘窗应有三个窗段');
    S.exitCheck(true);
    for (let n = 0; n < 12 && JSON.stringify(S.projectJSON()) !== ctx.panelBefore; n++) S.undo();
    assert(JSON.stringify(S.projectJSON()) === ctx.panelBefore, '结构编辑撤销未恢复');
    return '墙类型 / 开窗拆墙 / 弧直互换 / 窗转墙 / 门面板 / 飘窗模块均可用';
  });

  await check('check.entries', () => {
    const doc = win().document;
    assert(doc.querySelector('#impCheck'), '导入结果页缺少「校核图纸」按钮');
    assert(/校核/.test(doc.querySelector('#impCheck').textContent), '导入页按钮文案不对');
    doc.querySelector('#projectToggle').click();
    const button = doc.querySelector('#projectList [data-project-action="check"]');
    assert(button, '项目列表当前项目缺少「校核」按钮');
    doc.querySelector('#projectToggle').click();
    return '导入结果页与项目列表均有校核入口';
  });

  await check('plan.125c', async () => {
    const S = studio(), before = JSON.stringify(S.projectJSON());
    const data = await fetch('../data/125c-plan.json').then(response => response.json());
    const result = S.applyPlan(data);
    assert(result.ok, '125-C 示例迁移失败：' + (result.errors || []).join('；'));
    try {
      const p = S.getPlan();
      assert(p.walls.length === data.walls.length && p.wins.length === data.wins.length,
        '迁移后墙 / 窗数量不对：' + p.walls.length + ' / ' + p.wins.length);
      const checks = S.getChecks();
      assert(checks.all.every(issue => issue.key && Array.isArray(issue.objects) && issue.objects.every(o => o.id)),
        '检查结果缺少 key 或对象引用');
      ctx.sampleChecks = checks.all.map(issue => issue.code);
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === before, '125-C 示例撤销未恢复原项目');
    return 'walls=' + data.walls.length + '，wins=' + data.wins.length + '，检查 ' + ctx.sampleChecks.length + ' 处：' +
      [...new Set(ctx.sampleChecks)].join(',');
  });

  await check('plan.legacyStorage', async () => {
    const w = win();
    const v1 = {
      version:1, name:'旧本地方案',
      walls:[[0,0,3000,200,'e'],[3000,0,3400,2400,'n']],
      wins:[[800,0,1400,200]],
      rooms:[{id:'old',name:'旧房间',poly:[[0,200],[3000,200],[3000,2400],[0,2400]],mat:'wood'}],
      materials:{},
    };
    w.localStorage.setItem('interior-plan-v1', JSON.stringify(v1));
    w.localStorage.setItem('interior-state-v1', JSON.stringify({furniture:[], rooms:{}, demolished:['w0'], measures:[]}));
    w.location.reload();
    const ready = await waitFor(() => w.Studio && typeof w.Studio.getPlan === 'function' &&
      w.document.readyState === 'complete' && w.Studio.getPlan()?.rooms?.length, 15000, 50);
    assert(ready, '重载后 window.Studio 未就绪');
    await new Promise(resolve => setTimeout(resolve, 300));
    const S = studio();
    const p = S.getPlan(), st = S.getState();
    assert(p.version === 2, '旧 localStorage 方案未迁移为 V2（version=' + p.version + '）');
    assert(p.walls.length === 2 && p.wins.length === 1, '旧方案墙 / 窗数量不对：' + p.walls.length + ' / ' + p.wins.length);
    assert(typeof p.walls[0].id === 'string' && p.walls[0].rect.join(',') === '0,0,3000,200', '旧墙体未对象化');
    assert(st.demolished.length === 1 && st.demolished[0] === p.walls[0].id, '旧拆除下标未映射到墙体 id');
    const stored = JSON.parse(w.localStorage.getItem('interior-plan-v1'));
    assert(stored.version === 2 && typeof stored.walls[0].id === 'string', '迁移结果未写回 localStorage');
    return '旧 localStorage 的 Plan 与拆除下标已迁移并写回 V2';
  });

  await check('shot.png', () => {
    const S = studio();
    return Promise.resolve(S.shot({scale:1, clean:true})).then(url => {
      assert(typeof url === 'string', 'shot() 返回 ' + typeName(url) + '，期望 string');
      assert(url.startsWith('data:image/png'), '前缀不是 data:image/png：' + url.slice(0, 32));
      assert(url.length > 1000, 'dataURL 长度 ' + url.length + '，期望 > 1000');
      return 'data:image/png，长度 ' + url.length;
    });
  });

  await check('is3D.bool', () => {
    const S = studio();
    const v = S.is3D();
    assert(typeof v === 'boolean', 'is3D() 返回 ' + typeName(v) + '，期望 boolean');
    return 'is3D() = ' + v + '，View3D=' + typeof win().View3D;
  });

  finished = true;
  flush();
}

main().catch(e => {
  // 兜底：main 自身异常也要留下可解析的结果
  if (!CHECKS.length) record('runner', false, '运行器异常：' + ((e && e.message) || e));
  finished = true;
  flush();
});
</script>
</body>
</html>
