<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio 自测 · selftest</title>
<style>
  :root{--bg:#f3efe7;--panel:#fffdf9;--line:#e3dccf;--ink:#2b2824;--muted:#8a8174;--ok:#2f7a4f;--bad:#b3372a}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:baseline;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  header b{font-size:15px}
  header span{color:var(--muted)}
  #result{margin:0;padding:12px 16px;white-space:pre-wrap;word-break:break-all;
    font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
  #result.done-pass{color:var(--ok)}
  #result.done-fail{color:var(--bad)}
  iframe{display:block;width:1120px;max-width:100%;height:620px;margin:0 16px 16px;
    border:1px solid var(--line);border-radius:8px;background:#fff}
</style>
</head>
<body>
<header><b>Studio 自测</b><span>在 iframe 中加载 ../index.html，等待 window.Studio 后逐条断言</span></header>
<pre id="result"></pre>
<iframe id="app" src="../index.html" title="studio under test"></iframe>

<script>
/* ============================================================
 * 零依赖自测页：把 iframe 里的 window.Studio 当成被测对象。
 * 结果以 JSON 写进 <pre id="result">，供 tests/run.mjs 用 --dump-dom 抓取。
 * ============================================================ */
const RESULT = document.getElementById('result');
const frame = document.getElementById('app');
const CHECKS = [];
const ctx = {};                       // 跨断言共享被测对象
let finished = false;

function flush(){
  const passed = CHECKS.filter(c => c.ok).length;
  RESULT.textContent = JSON.stringify({
    passed, failed: CHECKS.length - passed, done: finished, checks: CHECKS,
  });
  if (finished){
    RESULT.className = passed === CHECKS.length ? 'done-pass' : 'done-fail';
    RESULT.textContent = JSON.stringify({
      passed, failed: CHECKS.length - passed, done: true, checks: CHECKS,
    }, null, 2);
  }
}

function record(name, ok, detail){
  CHECKS.push({name, ok: !!ok, detail: String(detail == null ? '' : detail)});
  flush();
}

// 单条断言：抛错记为 failed，继续下一条
async function check(name, fn){
  try {
    const detail = await fn();
    record(name, true, detail == null ? 'ok' : detail);
  } catch(e){
    record(name, false, (e && e.message) || String(e));
  }
}

function assert(cond, msg){ if (!cond) throw new Error(msg); }
const typeName = v => Array.isArray(v) ? 'array' : (v === null ? 'null' : typeof v);

// 轮询等待：返回 true 表示条件在超时前成立
function waitFor(fn, timeoutMs, intervalMs){
  return new Promise(resolve => {
    const t0 = Date.now();
    (function tick(){
      let ok = false;
      try { ok = !!fn(); } catch(e){}
      if (ok) return resolve(true);
      if (Date.now() - t0 >= timeoutMs) return resolve(false);
      setTimeout(tick, intervalMs || 50);
    })();
  });
}

const win = () => frame.contentWindow;
const studio = () => {
  const S = win() && win().Studio;
  assert(S && typeof S === 'object', 'window.Studio 不存在');
  return S;
};

const API_METHODS = ['getPlan','getState','applyPlan','applyOps','getSelection','select',
                     'flyToRoom','renderAll','sync','toast','is3D','shot'];

function dimensionFixture(plan){
  return {
    ...plan,
    bounds:{x:-900,y:-800,w:8000,h:5800},
    walls:[[0,0,6200,240,'e'],[0,3960,6200,4200,'e'],[0,240,240,3960,'e'],
      [5960,240,6200,3960,'e'],[2960,240,3080,3960,'n']],
    wins:[], doors:[], slides:[],
    rooms:[
      {id:'west',name:'西侧房间',mat:'wood',poly:[[240,240],[2960,240],[2960,3960],[240,3960]],at:[1600,2100]},
      {id:'east',name:'东侧房间',mat:'wood',poly:[[3080,240],[5960,240],[5960,3960],[3080,3960]],at:[4520,2100]},
    ],
  };
}

async function main(){
  // 等 iframe 中的入口脚本安装 Studio，最长 15 秒。
  const ready = await waitFor(() => win() && win().Studio && win().document.readyState !== 'loading', 15000, 25);
  if (ready){
    // 默认方案是异步 fetch 的，等它落地再开始，避免断言读到半初始化状态
    await waitFor(() => {
      const S = win().Studio;
      const p = S && S.getPlan();
      return p && Array.isArray(p.rooms) && p.rooms.length > 0;
    }, 5000, 50);
    await new Promise(r => setTimeout(r, 200));
  }

  await check('studio.api', () => {
    const S = studio();
    const missing = API_METHODS.filter(k => typeof S[k] !== 'function');
    assert(!missing.length, '缺少方法：' + missing.join(', '));
    return '全部 ' + API_METHODS.length + ' 个方法均为函数';
  });

  await check('app.namespaces', () => {
    const w = win(), app = w.App;
    assert(typeof app?.plan?.sanitizePlan === 'function', '缺少 App.plan.sanitizePlan');
    assert(typeof app?.store?.undo === 'function', '缺少 App.store.undo');
    assert(typeof app?.importer?.impOpenResult === 'function' && typeof app.importer.impClose === 'function', '缺少图纸预览接口');
    assert(typeof w.impOpenResult !== 'function' && typeof w.impClose !== 'function', '图纸预览接口泄漏到 window');
    if (w.View3D) assert(app.view3d === w.View3D, '3D 接口未连接');
    return '方案解析、撤销和图纸预览均由对应模块提供';
  });

  await check('plan.shape', () => {
    const S = studio();
    const p = S.getPlan();
    assert(p && typeof p === 'object' && !Array.isArray(p), 'getPlan() 未返回对象（' + typeName(p) + '）');
    assert(Array.isArray(p.rooms) && p.rooms.length > 0, 'rooms 不是非空数组（' + typeName(p.rooms) + '）');
    assert(Array.isArray(p.walls), 'walls 不是数组（' + typeName(p.walls) + '）');
    const r0 = p.rooms[0];
    ctx.roomId = r0 && r0.id;
    return 'rooms=' + p.rooms.length + '，walls=' + p.walls.length + '，首个房间=' + ctx.roomId;
  });

  await check('applyOps.setRoom', () => {
    const S = studio();
    const id = ctx.roomId;
    assert(id, '没有可用的房间 id');
    const st0 = S.getState();
    assert(st0 && typeof st0 === 'object' && st0.rooms && typeof st0.rooms === 'object',
      'getState() 未返回带 rooms 的对象');
    assert(st0.rooms[id], 'state.rooms 缺少房间 ' + id);
    ctx.origMat = st0.rooms[id].mat;

    const res = S.applyOps([{op:'setRoom', room:id, mat:'wood'}]);
    assert(res && typeof res === 'object', 'applyOps 未返回对象');
    assert(res.applied >= 1, 'applied=' + res.applied + '，期望 >= 1；errors=' + JSON.stringify(res.errors || []));
    const st1 = S.getState();
    assert(st1.rooms[id], '撤销前的 state.rooms 丢失房间 ' + id);
    assert(st1.rooms[id].mat === 'wood', 'getState().rooms.' + id + '.mat=' + st1.rooms[id].mat + '，期望 wood');
    return 'applied=' + res.applied + '，skipped=' + res.skipped + '，' + id + '.mat: ' + ctx.origMat + ' → wood';
  });

  await check('applyOps.undo', () => {
    const S = studio();
    const id = ctx.roomId;
    assert(id, '没有可用的房间 id');
    if (typeof S.undo === 'function'){
      S.undo();
    } else {
      // 没有便捷入口时退回键盘快捷键（Ctrl+Z）。
      // 必须派发到 body 并冒泡：页面的监听器会读 e.target.matches(...)，target 为 document 时会抛错。
      const w = win();
      const target = w.document.body || w.document.documentElement;
      target.dispatchEvent(new w.KeyboardEvent('keydown',
        {key:'z', code:'KeyZ', keyCode:90, ctrlKey:true, bubbles:true, cancelable:true}));
    }
    const st = S.getState();
    assert(st.rooms[id], '撤销后 state.rooms 丢失房间 ' + id);
    assert(st.rooms[id].mat === ctx.origMat,
      '撤销后 ' + id + '.mat=' + st.rooms[id].mat + '，期望回到 ' + ctx.origMat);
    return 'mat 已回到 ' + ctx.origMat + '（撤销入口：' + (typeof S.undo === 'function' ? 'Studio.undo' : 'Ctrl+Z') + '）';
  });

  await check('applyOps.unknownId', () => {
    const S = studio();
    const before = JSON.stringify(S.getState());
    let res;
    try {
      res = S.applyOps([{op:'setRoom', room:'__no_such_room__', mat:'wood'}]);
    } catch(e){
      throw new Error('未知 id 的 op 抛出异常：' + ((e && e.message) || e));
    }
    assert(res && typeof res === 'object', 'applyOps 未返回对象');
    assert(res.skipped >= 1, 'skipped=' + res.skipped + '，期望 >= 1');
    assert(res.applied === 0, 'applied=' + res.applied + '，期望 0');
    assert(JSON.stringify(S.getState()) === before, '未知 id 的 op 不应改动 state');
    return 'skipped=' + res.skipped + '，applied=' + res.applied + '，未抛错且 state 未变';
  });

  await check('applyPlan.importFurniture', () => {
    const S = studio();
    const previousPlan = S.getPlan();
    const previousFurniture = S.getState().furniture;
    const [x, y] = previousPlan.rooms[0].poly[0];
    const furniture = {type:'chair', name:'图纸餐椅', cx:x+500, cy:y+600, w:470, d:510, rot:32.5};
    const plan = {...previousPlan, name:'导入家具自测'};
    const result = S.applyPlan(plan, {furniture:[furniture], clearFurniture:true, freshState:true});
    assert(result.ok, '导入方案失败');
    try {
      const [imported, ...others] = S.getState().furniture;
      assert(imported && imported.id && others.length === 0, '应生成一个带 ID 的家具实例');
      for (const [key, value] of Object.entries(furniture)){
        assert(imported[key] === value, key + ' 未保留原值 ' + value);
      }
      const stored = JSON.parse(win().localStorage.getItem('interior-state-v1'));
      assert(stored.furniture[0].id === imported.id, '家具未保存到项目状态');
    } finally {
      S.undo();
    }
    assert(S.getPlan().name === previousPlan.name, '一次撤销应还原户型');
    assert(JSON.stringify(S.getState().furniture) === JSON.stringify(previousFurniture), '一次撤销应还原家具');
    return '坐标、尺寸和 32.5° 朝向已保留并保存，户型和家具可一起撤销';
  });

  await check('applyPlan.importComponents', () => {
    const S = studio();
    const plan = S.getPlan();
    const count = S.getState().furniture.length;
    const [x, y] = plan.rooms[0].poly[0];
    const component = {type:'component', name:'折返楼梯', cx:x+1000, cy:y+1200, w:1600, d:2200, rot:90, parts:[
      {shape:'stairs', x:-.25, z:0, w:.5, d:.7, y:0, h:900, steps:5},
      {shape:'winder', x:0, z:.4, w:1, d:.2, y:900, h:720, steps:4, pivot:[0,-.5],
        edges:[[-.5,-.5],[-.5,.5],[0,.5],[.5,.5],[.5,-.5]]},
      {shape:'stairs', x:.25, z:0, w:.5, d:.7, y:1620, h:900, rot:180, steps:5},
    ]};
    assert(S.applyPlan(plan, {furniture:[component]}).ok, '合并构件失败');
    try {
      const imported = S.getState().furniture.find(item => item.name === component.name);
      assert(imported?.parts.length === 3, '梯段和扇形转角被丢弃');
      for (const [i, part] of component.parts.entries()){
        for (const [key, value] of Object.entries(part)){
          assert(JSON.stringify(imported.parts[i][key]) === JSON.stringify(value), '部件 ' + i + ' 的 ' + key + ' 未保留');
        }
      }
      const stored = JSON.parse(win().localStorage.getItem('interior-state-v1'));
      assert(stored.furniture.some(item => item.id === imported.id && item.parts.length === 3), '构件未保存');
      const footprint = win().document.querySelector('#gFurn [data-fid="' + imported.id + '"]');
      assert(footprint && footprint.querySelectorAll('line').length >= 8, '平面图里没有绘出踏步线');
      assert(footprint.querySelectorAll('[data-part-shape="winder"] polygon').length === 4, '平面图里没有绘出四级扇形踏步');
    } finally {
      S.undo();
    }
    assert(S.getState().furniture.length === count, '撤销未还原原布置');
    return '直梯和四级扇形踏步已绘制、保存并支持撤销';
  });

  await check('applyPlan.curves', () => {
    const S = studio(), doc = win().document, original = S.projectJSON();
    const curve = {from:[0,0], to:[2000,0], sweep:90, thickness:180};
    const room = {id:'curved',name:'弧形测试房',poly:[[0,0],[2000,0],[2000,2000],[0,2000]],arcs:[{edge:0,sweep:90}],mat:'wood'};
    const plan = {name:'弧形测试', walls:[[0,2000,2000,2180,'e'],{...curve,kind:'n',height:2300}],
      wins:[{...curve,from:[2000,0],to:[2000,2000]}], rooms:[room]};
    const result = S.applyPlan(plan);
    assert(result.ok && result.errors.length === 0, '弧形方案校验失败');
    try {
      const active = S.getPlan();
      assert(active.walls[1].height === 2300 && active.wins[0].sweep === 90 && active.rooms[0].arcs[0].edge === 0, '圆弧字段未保留');
      assert(active.bounds.y < -414 && active.bounds.x + active.bounds.w > 2414, '方案范围未包含圆弧外缘');
      assert(doc.querySelector('#gWalls rect') && doc.querySelector('#gWalls path[data-wall="w1"]'), '二维墙体应同时绘制直线和弧线');
      assert(doc.querySelectorAll('#gOpen path').length === 3, '圆弧窗缺少外轮廓或框线');
      assert(/A[\d.]+/.test(doc.querySelector('#gRooms path[data-room="curved"]').getAttribute('d')), '房间边界未绘制圆弧');
      assert(doc.querySelector('#subtitle').textContent.includes('4.57 m²'), '房间面积应包含圆弧弓形');
      assert(JSON.parse(win().localStorage.getItem('interior-plan-v1')).rooms[0].arcs[0].sweep === 90, '圆弧边未写入项目存储');
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复原方案');
    return '弧形墙窗、房间轮廓、面积、存储和撤销';
  });

  await check('importReview.furnitureGeometry', () => {
    const S = studio(), w = win(), doc = w.document, original = S.projectJSON();
    const importer = w.App.importer;
    const plan = {...original.plan, rooms:[{id:'living',name:'客餐厅',mat:'wood',poly:[[0,0],[6000,0],[6000,5000],[0,5000]]}]};
    const furniture = [
      {type:'cornersofa',name:'右转角沙发',cx:3600,cy:1700,w:3300,d:2800,rot:0,handedness:'right'},
      {type:'coffeetable',name:'小圆茶几',cx:3200,cy:1800,w:800,d:800,rot:0,topShape:'round',height:310},
      {type:'sidetable',name:'矩形条几',cx:5500,cy:1600,w:1750,d:400,rot:90,topShape:'rect'},
    ];
    assert(importer.impOpenResult({plan, furniture}, () => null), '无法打开图纸结果预览');
    try {
      const preview = doc.querySelector('#impRoomDrawing');
      assert(preview.querySelector('g[transform="scale(-1 1)"]') && preview.querySelector('ellipse[rx="400"]') && preview.querySelector('rect[width="1750"]'), '预览与家具几何不一致');
    } finally { importer.impClose(); }

    assert(S.applyPlan(plan, {furniture, clearFurniture:true, freshState:true}).ok, '无法应用家具几何');
    try {
      const [sofa, table, side] = S.projectJSON().state.furniture;
      assert(sofa.handedness === 'right' && table.topShape === 'round' && table.height === 310 && side.topShape === 'rect', '保存或导出时遗失家具几何');
      const shape = id => doc.querySelector('#gFurn [data-fid="' + id + '"]');
      assert(shape(sofa.id).querySelector('g[transform="scale(-1 1)"]'), '转角未在沙发右侧');
      assert(shape(table.id).querySelector('ellipse[rx="400"][ry="400"]') && shape(side.id).querySelector('rect'), '台面形状丢失');
      S.select({kind:'furn', id:sofa.id});
      const select = doc.querySelector('#fHandedness');
      assert(select.value === 'right', '右侧属性未加载');
      select.value = 'left'; select.dispatchEvent(new w.Event('change'));
      assert(!shape(sofa.id).querySelector('g[transform="scale(-1 1)"]'), '属性修改未影响沙发轮廓');
      S.undo();
      assert(S.getState().furniture[0].handedness === 'right', '属性修改无法撤销');
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复原项目');
    return '逐房预览、转角侧、台面形状和高度可保存与撤销';
  });

  await check('applyPlan.terracesAndRaisedBays', () => {
    const S = studio(), original = S.projectJSON(), host = original.plan.rooms[0];
    const terrace = {id:'out',name:'露台',poly:[[0,-2000],[4000,-2000],[4000,0],[0,0]],outdoor:true,counted:false};
    const bay = {id:'bay',name:'弧形飘窗',poly:[[4000,0],[4400,-700],[5400,-700],[5800,0]],
      arcs:[{edge:0,sweep:45},{edge:2,sweep:45}],bay:{roomId:host.id,openingEdges:[3,3,8],sillHeight:620}};
    assert(S.applyPlan({...original.plan,rooms:[host,terrace,bay]}).ok,'飘窗方案应用失败');
    try {
      const [,open,raised] = S.getPlan().rooms;
      assert(open.outdoor && open.counted === false && !open.bay,'露台不得被当作窗台');
      assert(raised.counted === false && raised.bay.roomId === host.id && raised.bay.sillHeight === 620 &&
        JSON.stringify(raised.bay.openingEdges) === '[3]' && raised.arcs.length === 2,'飘窗开口、标高和弧边未完整保留');
      assert(win().document.querySelector('path[data-room="bay"]')?.getAttribute('d').includes('A'),'飘窗弧边未绘制');
      const stored = JSON.parse(win().localStorage.getItem('interior-plan-v1'));
      assert(stored.rooms[2].bay.sillHeight === 620,'窗台标高未随项目保存');
    } finally { S.undo(); }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original),'撤销未恢复原项目');
    return '室外地坪和弧形飘窗分别保留，开口和标高随项目保存';
  });

  await check('applyOps.editScene', () => {
    const S = studio();
    const before = S.projectJSON();
    const room = before.plan.rooms[0].id;
    const [x, y] = before.plan.rooms[0].poly[0];
    const wall = [x+400,y+600,x+1400,y+720,'n',2450];
    const component = {type:'component',name:'通道端景',cx:x+800,cy:y+900,w:500,d:290,rot:0,
      parts:[{shape:'box',x:0,z:0,w:1,d:1,y:0,h:900}]};
    const res = S.applyOps([{op:'editScene',changes:[
      {action:'add',path:['plan','walls','-'],value:wall},
      {action:'replace',path:['state','rooms',room,'name'],value:'联动修改'},
      {action:'add',path:['state','furniture','-'],value:component},
    ]}]);
    assert(res.applied === 1 && res.skipped === 0, '多对象修改失败：' + res.errors.join('；'));
    try {
      assert(JSON.stringify(S.getPlan().walls.at(-1)) === JSON.stringify(wall), '墙高没有保存');
      assert(S.getState().rooms[room].name === '联动修改', '房间没有更新');
      assert(S.getState().furniture.some(item => item.name === component.name && item.id && item.parts.length === 1), '自定义构件没有生成');
      const at = JSON.stringify(S.projectJSON());
      const invalid = S.applyOps([{op:'editScene',changes:[
        {action:'replace',path:['plan','name'],value:'应撤回'},
        {action:'remove',path:['plan','walls',9999]},
      ]}]);
      assert(invalid.applied === 0 && invalid.skipped === 1, '无效补丁应被整条拒绝');
      assert(JSON.stringify(S.projectJSON()) === at, '无效补丁的部分内容已写入');
    } finally {
      S.undo();
    }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(before), '一次撤销应恢复原户型及布置');
    return '保留墙高，联动修改房间与构件，无效补丁不落盘，统一撤销';
  });

  await check('ceiling.editPreviewPersistenceAndUndo', () => {
    const S = studio(), app = win().App;
    const before = S.projectJSON();
    const plan = dimensionFixture(before.plan);
    const path = ['state', 'ceiling', 'rooms', 'west'];
    const design = {
      zones:[{id:'test-drop', name:'样板顶', poly:[[600,600],[2400,600],[2400,2600],[600,2600]], drop:180, color:'#faf6ed'}],
      edges:[],
      fixtures:[{id:'test-light', type:'downlight', x:1500, y:1300, zoneId:'test-drop'}],
    };
    try {
      assert(S.applyPlan(plan, {freshState:true}).ok, '样板户型未安装');
      const changes = [{action:'add', path, value:design}];
      const preview = S.prepareCeilingEdit(changes);
      assert(!S.getState().ceiling.rooms.west && preview.rooms.west.zones[0].drop === 180, '预览写入了正式方案');
      const result = S.applyOps([{op:'editScene', changes}]);
      assert(result.applied === 1, result.errors.join('、'));
      assert(app.ceilingModel.fixtureHeight(S.getState().ceiling, plan.rooms[0], design.fixtures[0]) === 2620,
        '灯具没有跟随吊顶完成面');
      const invalid = S.applyOps([{op:'editScene', changes:[
        {action:'replace', path:[...path, 'zones', 0, 'drop'], value:150},
        {action:'replace', path:[...path, 'fixtures', 0, 'x'], value:9000},
      ]}]);
      assert(!invalid.applied && S.getState().ceiling.rooms.west.zones[0].drop === 180, '无效补丁部分生效');
      const exported = JSON.parse(JSON.stringify(S.projectJSON()));
      assert(app.store.fixState(exported.state).ceiling.rooms.west.fixtures[0].id === 'test-light', '项目 JSON 丢失灯具');
      S.undo();
      assert(!S.getState().ceiling.rooms.west, '撤销没有回到原顶');
      S.redo();
      assert(S.getState().ceiling.rooms.west.fixtures.length === 1, '重做没有恢复灯位');
    } finally {
      S.applyPlan(before.plan, {history:false});
      app.store.state = app.store.fixState(before.state);
      app.store.afterHistory();
    }
  });

  await check('ceiling.toolsToggleAndWhiteDefault', () => {
    const S = studio(), {App:app, document:doc} = win();
    const before = S.projectJSON();
    try {
      assert(S.applyPlan(dimensionFixture(before.plan), {freshState:true}).ok, '样板户型未安装');
      S.select({kind:'room',id:'west'});
      doc.querySelector('#ceilingMode').click();
      const button = type => doc.querySelector('#ceilingLibrary [data-value="' + type + '"]');
      assert(button('downlight').querySelector('svg'), '灯具缩略图缺失');
      button('downlight').click();
      assert(app.ceilingEditor.context()?.tool === 'downlight', '筒灯工具未启动');
      button('downlight').click();
      assert(app.ceilingEditor.context()?.tool === 'select', '再次点击没有退出筒灯布置');
      button('flat').click();
      const zone = S.getState().ceiling.rooms.west?.zones[0];
      assert(zone?.color === '#ffffff', '新吊顶的默认饰面应为白色');
      assert(button('flat').getAttribute('aria-pressed') === 'true', '当前预设未标为选中');
      button('flat').click();
      assert(S.getState().ceiling.rooms.west.zones.length === 1, '退出预设时重复新增了吊顶');
      assert(button('flat').getAttribute('aria-pressed') === 'false', '再次点击没有退出预设');
      assert(app.ceilingEditor.context()?.kind === 'room', '二次点击未返回房间选区');
    } finally {
      app.ceilingEditor.close();
      S.applyPlan(before.plan, {history:false});
      app.store.state = app.store.fixState(before.state);
      app.store.afterHistory();
    }
  });

  await check('dimensions.geometryAndSelection', () => {
    const S = studio(), doc = win().document, original = S.projectJSON();
    const fixture = dimensionFixture(original.plan);
    const sofa = {type:'sofa',name:'测试沙发',cx:1600,cy:1500,w:1800,d:850,rot:35};
    assert(S.applyPlan(fixture, {furniture:[sofa],clearFurniture:true,freshState:true}).ok, '尺寸测试方案无法加载');
    try {
      const values = (kind, axis) => [...doc.querySelectorAll(`#gDims .dim-${kind}[data-axis="${axis}"] [data-dimension-value]`)]
        .map(node => Number(node.dataset.dimensionValue));
      assert(values('total', 'x')[0] === 6200 && values('total', 'y')[0] === 4200, '总尺寸应取外墙尺寸');
      const segments = values('chain', 'x');
      assert(segments.length >= 2 && segments.every(value => value > 0) &&
        segments.reduce((sum, value) => sum + value, 0) === 6200, '连续分段之和应等于总宽');
      for (const [id, width] of [['west',2720],['east',2880]]){
        S.select({kind:'room',id});
        assert(values('selection', 'x')[0] === width && values('selection', 'y')[0] === 3720,
          id + ' 房间的净宽或净深不正确');
      }
      const item = S.getState().furniture[0];
      S.select({kind:'furn',id:item.id});
      const selectionText = () => doc.querySelector('#gDims .dim-selection[data-axis="x"] [data-dimension-value]').textContent;
      assert(selectionText().includes('1800 × 850 mm'), '旋转家具应注明实际宽深');
      const angle = 35 * Math.PI / 180;
      const projectedWidth = (w,d) => Math.round((w * Math.cos(angle) + d * Math.sin(angle)) * 10) / 10;
      assert(values('selection', 'x')[0] === projectedWidth(1800,850), '横向标注未与家具投影对应');
      const resize = S.applyOps([{op:'resizeFurniture',id:item.id,w:1900,d:900}]);
      assert(resize.applied === 1, '无法调整家具尺寸');
      try {
        assert(selectionText().includes('1900 × 900 mm') && values('selection', 'x')[0] === projectedWidth(1900,900),
          '画布标注未随家具更新');
      } finally {
        S.undo();
      }
      assert(selectionText().includes('1800 × 850 mm'), '撤销后未恢复家具标注');
    } finally {
      S.select(null);
      S.undo();
    }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复尺寸测试前的项目');
    return '外墙总尺寸、分段合计、房间净宽深和旋转家具标注均来自模型';
  });

  await check('dimensions.recordAndCalibrate', () => {
    const S = studio(), w = win(), doc = w.document, original = S.projectJSON();
    const {dimensions} = w.App;
    assert(S.applyPlan(dimensionFixture(original.plan), {freshState:true,clearFurniture:true}).ok, '校准方案无法加载');
    let undoSteps = 1;
    try {
      const before = JSON.stringify(S.getPlan());
      dimensions.addPoint([0,1800]);
      dimensions.addPoint([6200,1800]);
      const [mark] = S.projectJSON().state.dimensionMarks;
      if (mark) undoSteps++;
      assert(mark?.axis === 'x' && mark.a.kind === 'wall' && mark.b.kind === 'wall', '手动标注未吸附到墙面');
      const value = () => Number(doc.querySelector('#gDims .dim-manual[data-axis="x"] [data-dimension-value]').dataset.dimensionValue);
      assert(value() === 6200 && !doc.querySelector('#dimensionEditor').hidden, '手动标注未显示模型尺寸');
      doc.querySelector('#dimensionOriginal').value = '7440';
      doc.querySelector('#dimensionForm').requestSubmit();
      const recorded = S.projectJSON().state.dimensionMarks[0];
      if (recorded?.original === 7440) undoSteps++;
      const stored = JSON.parse(w.localStorage.getItem('interior-state-v1'));
      assert(recorded?.original === 7440 && stored?.dimensionMarks?.[0]?.original === 7440, '原图尺寸未保存');
      assert(JSON.stringify(S.getPlan()) === before && value() === 6200, '记录原图值时不应移动几何');

      const target = doc.querySelector('#dimensionTarget'), summary = doc.querySelector('#dimensionRecorded');
      assert(target.value === '7440', '首个原图值应作为默认校准目标');
      target.value = '9300';
      doc.querySelector('#dimensionScale').click();
      const scaled = S.getPlan();
      if (JSON.stringify(scaled) !== before) undoSteps++;
      assert(scaled.walls[3][2] === 9300 && scaled.rooms[0].poly[1][0] === 4440, '校准应使用独立的目标输入');
      assert(value() === 9300 && S.projectJSON().state.dimensionMarks[0].id === mark.id, '标注未跟随校准后的墙面');
      assert(doc.querySelector('#dimensionOriginal').value === '7440' && summary.textContent.includes('7440') &&
        summary.textContent.includes('1860') && doc.querySelector('#dimensionEditorStatus').textContent.includes('9300'),
        '记录原图、目标尺寸和校准结果应各自明确显示');
      S.undo();
      undoSteps--;
      assert(JSON.stringify(S.getPlan()) === before && value() === 6200 &&
        S.projectJSON().state.dimensionMarks[0].original === 7440 &&
        !doc.querySelector('#dimensionEditorStatus').textContent, '撤销校准应保留原图值并清除成功提示');

      const move = doc.querySelector('#dimensionMove');
      assert(!move.hidden, '垂直墙面的标注应允许移动终点墙');
      target.value = '6500';
      move.click();
      const moved = S.getPlan();
      if (JSON.stringify(moved) !== before) undoSteps++;
      assert(moved.walls[3][2] === 6500 && moved.walls[3][0] === 6260 &&
        moved.rooms[1].poly[1][0] === 6260 && moved.rooms[0].poly[1][0] === 2960,
        '移动终点墙应保持墙厚并只调整相接房间。' + doc.querySelector('#dimensionEditorStatus').textContent);
      assert(value() === 6500 && S.projectJSON().state.dimensionMarks[0].original === 7440, '移动墙体应更新模型值并保留原图值');
      S.undo();
      undoSteps--;
      assert(JSON.stringify(S.getPlan()) === before && value() === 6200 &&
        JSON.stringify(S.projectJSON().state.dimensionMarks[0]) === JSON.stringify(recorded), '撤销移墙应恢复坐标和原有标注');
    } finally {
      dimensions.clearDraft();
      dimensions.closeEditor();
      while (undoSteps-- > 0) S.undo();
    }
    assert(JSON.stringify(S.projectJSON()) === JSON.stringify(original), '撤销未恢复校准前项目');
    return '墙面标注与原图值可保存，等比校准与移动终点墙均更新坐标并可撤销';
  });

  await check('floorPlan.furniturePlacementAndLabelFit', () => {
    const S = studio(), w = win(), doc = w.document, {store} = w.App;
    const before = S.projectJSON(), undo = store.undoStack.slice(), redo = store.redoStack.slice();
    const search = doc.querySelector('#libSearch'), priorQuery = search.value;
    const fixture = dimensionFixture(before.plan);
    fixture.rooms[0].name = 'Children’s bedroom with a long descriptive name';
    fixture.rooms[1].name = 'Children’s outdoor bay window with a long descriptive name';
    fixture.rooms[1].outdoor = true;
    try {
      assert(S.applyPlan(fixture, {freshState:true, clearFurniture:true}).ok, '家具测试方案安装失败');
      const label = id => doc.querySelector(`[data-room-label="${id}"] text`);
      const roomA = label('west'), roomB = label('east');
      assert(roomA?.textContent.includes('…') && roomB?.textContent.includes('…'), '长房间名应在可用宽度内省略');
      assert(roomA.getBBox().x + roomA.getBBox().width < roomB.getBBox().x, '相邻房间名不应重叠');
      assert(doc.querySelector('#gRooms [data-room="west"]').parentElement.getAttribute('aria-label').includes(fixture.rooms[0].name),
        '房间图形应保留完整名称');

      search.value = '单人沙发';
      search.dispatchEvent(new w.Event('input'));
      const add = () => doc.querySelector('#libItems [data-key="0"]').click();
      S.select({kind:'room', id:'west'}); add();
      S.select({kind:'room', id:'west'}); add();
      const [first,second] = S.getState().furniture;
      assert(first.id !== second.id && (first.cx !== second.cx || first.cy !== second.cy),
        '连续添加同款家具应在房间允许时避开重叠');
      assert(!doc.querySelector('#panel [role="status"]'), '合法室内摆放不应提示异常');
      S.select({kind:'room', id:'east'}); add();
      assert(!doc.querySelector('#panel [role="status"]'), '已划分的室外区域应允许正常摆放');
      const edit = (id, value) => {
        const field = doc.querySelector(id);
        field.value = value;
        field.dispatchEvent(new w.Event('change'));
      };
      const fullName = 'A long furniture name that must stay available in full';
      edit('#fName', fullName);
      const item = doc.querySelector(`#gFurn [data-fid="${S.getState().furniture.at(-1).id}"]`);
      assert(item.getAttribute('aria-label') === fullName && item.querySelector('title').textContent === fullName,
        '长家具名应可完整获取');
      edit('#fX', '60000');
      assert(doc.querySelector('#panel [role="status"]')?.textContent.includes('已绘制区域') &&
        S.getState().furniture.at(-1).cx === 60000, '户型外摆放应提示且可保留');
      edit('#fW', '100000');
      assert(doc.querySelector('#panel [role="status"]')?.textContent.includes('毫米') &&
        S.getState().furniture.at(-1).w === 100000, '极端尺寸应提示且可保留');
    } finally {
      S.applyPlan(before.plan, {history:false});
      store.state = store.fixState(before.state);
      store.undoStack.splice(0, store.undoStack.length, ...undo);
      store.redoStack.splice(0, store.redoStack.length, ...redo);
      store.afterHistory();
      search.value = priorQuery;
      search.dispatchEvent(new w.Event('input'));
    }
    return '房间名避让、家具重复添加、室外摆放与异常提示';
  });

  await check('walk.projectViewpoints', () => {
    const S = studio(), {store} = win().App, old = store.state.walk;
    const room = S.getPlan().rooms[0];
    const pose = {x:room.at[0],y:room.at[1],height:1.55,yaw:.5,pitch:-.1,roomId:room.id};
    const view = {id:'test-view',name:'室内机位',pose,scene:{hour:15,night:false,furn:true}};
    try {
      store.state = store.fixState({...store.state, walk:{recent:[pose,pose],views:[view,{...view,id:'invalid',pose:{...pose,height:-1}}]}});
      store.save();
      const saved = JSON.parse(win().localStorage.getItem('interior-state-v1')).walk;
      assert(saved.recent.length === 1 && saved.views.length === 1, '漫游位置未去重或非法视角被保留');
      assert(saved.views[0].scene.hour === 15, '视角未保存场景显示设置');
      const edit = S.applyOps([{op:'editScene',changes:[{action:'replace',path:['plan','name'],value:store.PLAN.name + ' 测试'}]}]);
      assert(edit.applied === 1, '联动编辑失败');
      try {
        assert(JSON.stringify(S.projectJSON().state.walk) === JSON.stringify(saved), '联动编辑移除了项目视角');
      } finally { S.undo(); }
      assert(JSON.stringify(S.projectJSON().state.walk) === JSON.stringify(saved), '编辑撤销移除了项目视角');
    } finally {
      store.state.walk = old;
      store.save();
    }
    return '最近的位置和命名视角随项目保存，保留朝向和场景设置';
  });

  await check('shot.png', () => {
    const S = studio();
    return Promise.resolve(S.shot({scale:1, clean:true})).then(url => {
      assert(typeof url === 'string', 'shot() 返回 ' + typeName(url) + '，期望 string');
      assert(url.startsWith('data:image/png'), '前缀不是 data:image/png：' + url.slice(0, 32));
      assert(url.length > 1000, 'dataURL 长度 ' + url.length + '，期望 > 1000');
      return 'data:image/png，长度 ' + url.length;
    });
  });

  await check('is3D.bool', () => {
    const S = studio();
    const v = S.is3D();
    assert(typeof v === 'boolean', 'is3D() 返回 ' + typeName(v) + '，期望 boolean');
    return 'is3D() = ' + v;
  });

  await check('projects.newNameForm', () => {
    const w = win(), doc = w.document, {projects} = w.App;
    const click = selector => doc.querySelector(selector).click();
    const original = projects.activeProjectId;
    click('#projectToggle');
    try {
      click('#projectNew');
      assert(projects.activeProjectId === original, '尚未确认名称就切换了项目');
      const form = doc.querySelector('#projectRenameForm');
      const input = doc.querySelector('#projectRenameInput');
      assert(!form.hidden && input.value === '新项目', '新建项目未提供名称');
      assert(form.querySelector('[type="submit"]').textContent === '创建', '表单没有标明创建动作');
      click('#projectRenameCancel');
      assert(form.hidden && projects.activeProjectId === original, '取消表单改变了项目');
    } finally { click('#projectClose'); }
    return '新建项目先提供名称，取消后保留当前项目';
  });

  await check('ceiling.activePlanTabKeepsDraft', () => {
    const w = win(), doc = w.document, {ceilingEditor, plan} = w.App;
    const click = selector => doc.querySelector(selector).click();
    click('#ceilingMode');
    try {
      click('#ceilingLibrary [data-cmd="tool"][data-value="polygon"]');
      const room = plan.roomDef(ceilingEditor.context()?.roomId);
      assert(room && ceilingEditor.context()?.tool === 'polygon', '未进入顶面自由轮廓工具');
      for (const offset of [-180, 180]){
        const event = {target:doc.querySelector('#plan'), clientX:0, clientY:0};
        const pointer = ceilingEditor.startPointer(event, {x:room.at[0] + offset, y:room.at[1]});
        ceilingEditor.endPointer(pointer, false);
      }
      const draft = doc.querySelector('#ceilingSketch').innerHTML;
      assert(draft && !doc.querySelector('#ceilingTask').hidden, '未添加顶面草稿顶点');
      click('[data-view="2d"]');
      assert(ceilingEditor.context()?.tool === 'polygon' &&
        doc.querySelector('#ceilingSketch').innerHTML === draft, '再次点击 2D 平面清除了天花草稿');
    } finally { ceilingEditor.close(); }
    return '再次点击已选中的 2D 平面保留顶面自由轮廓草稿';
  });

  await check('files.designAndProjectJSON', async () => {
    const w = win(), doc = w.document, S = studio(), {store, ceilingEditor} = w.App;
    const name = '可编辑设计 / 客户版';
    const room = S.getPlan().rooms[0];
    const pose = {x:room.at[0], y:room.at[1], height:1.55, yaw:.5, pitch:0, roomId:room.id};
    assert(S.applyOps([{op:'editScene',changes:[{action:'replace',path:['plan','name'],value:name}]}]).applied === 1, '测试项目重命名失败');
    await ceilingEditor.open(room.id);
    try { doc.querySelector('#ceilingLibrary [data-cmd="preset"][data-value="flat"]').click(); }
    finally { ceilingEditor.close(); }
    store.state.walk.recent = [pose];
    store.state.renders = [{url:'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMB/Trv3yQAAAAASUVORK5CYII='}];
    const clicks = [], anchor = w.HTMLAnchorElement.prototype;
    const previous = anchor.click;
    anchor.click = function(){
      if (this.download) clicks.push({name:this.download, json:w.fetch(this.href).then(r => r.json())});
    };
    try {
      doc.querySelector('#exportProj').click();
      doc.querySelector('#exportJson').click();
    } finally { anchor.click = previous; }
    assert(clicks.length === 2 && clicks[0].name === '可编辑设计 _ 客户版 - 完整项目.json' &&
      clicks[1].name === '可编辑设计 _ 客户版 - 设计.json', '两个导出文件名无法区分或含路径分隔符');
    const [project, design] = await Promise.all(clicks.map(item => item.json));
    assert(project.version === 2 && design.version === 2 && project.renders.length === 1 &&
      project.state.walk.recent[0].roomId === room.id, '完整项目缺少效果图或漫游记录');
    assert(design.plan.name === name && design.state.ceiling.rooms[room.id]?.zones.length === 1 && !('renders' in design.state) &&
      !('walk' in design.state), '设计导出内容范围错误');
    return '文件名包含项目名，两种导出保留天花设计，完整项目另含效果图与漫游机位';
  });

  finished = true;
  flush();
}

main().catch(e => {
  // 兜底：main 自身异常也要留下可解析的结果
  if (!CHECKS.length) record('runner', false, '运行器异常：' + ((e && e.message) || e));
  finished = true;
  flush();
});
</script>
</body>
</html>
